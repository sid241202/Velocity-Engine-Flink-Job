apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-config
  namespace: velocity-namespace
data:
  flink-conf.yaml: |+
    jobmanager.rpc.address: flink-jobmanager
    taskmanager.numberOfTaskSlots: 2
    blob.server.port: 6124
    jobmanager.rpc.port: 6123
    taskmanager.rpc.port: 6122
    queryable-state.proxy.ports: 6125
    jobmanager.memory.process.size: 2048m
    taskmanager.memory.process.size: 8192m
    state.backend: rocksdb
    state.backend.incremental: true
    state.checkpoints.dir: s3://your-bucket/flink-checkpoints/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: velocity-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      containers:
      - name: jobmanager
        image: flink:1.18-java11
        args: ["jobmanager"]
        ports:
        - containerPort: 6123
          name: rpc
        - containerPort: 8081
          name: ui
        # MEMORY/CPU JUSTIFICATION:
        # The JobManager coordinates the cluster but does no data processing. 
        # 2GB RAM is standard and sufficient to maintain checkpoint states and task scheduling.
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "1500m"
            memory: "2Gi"
        env:
        - name: JOB_MANAGER_RPC_ADDRESS
          value: flink-jobmanager
        volumeMounts:
        - name: flink-config-volume
          mountPath: /opt/flink/conf
      volumes:
      - name: flink-config-volume
        configMap:
          name: flink-config
          items:
          - key: flink-conf.yaml
            path: flink-conf.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: velocity-namespace
spec:
  type: ClusterIP
  ports:
  - name: rpc
    port: 6123
  - name: blob-server
    port: 6124
  - name: webui
    port: 8081
  selector:
    app: flink
    component: jobmanager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: velocity-namespace
spec:
  replicas: 4
  selector:
    matchLabels:
      app: flink
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
    spec:
      containers:
      - name: taskmanager
        image: flink:1.18-java11
        args: ["taskmanager"]
        ports:
        - containerPort: 6122
          name: rpc
        # MEMORY/CPU JUSTIFICATION:
        # TaskManagers do the heavy lifting. They hold the RocksDB State Backend buckets and 
        # Java Heap space for deserializing events.
        # We assign 8GB of RAM because Flink automatically allocates ~50% to Managed Memory (RocksDB)
        # ensuring disk spills are highly optimized without crashing the JVM.
        resources:
          requests:
            cpu: "2000m"
            memory: "8Gi"
          limits:
            cpu: "4000m"
            memory: "10Gi" 
        env:
        - name: JOB_MANAGER_RPC_ADDRESS
          value: flink-jobmanager
        volumeMounts:
        - name: flink-config-volume
          mountPath: /opt/flink/conf
      volumes:
      - name: flink-config-volume
        configMap:
          name: flink-config
          items:
          - key: flink-conf.yaml
            path: flink-conf.yaml
