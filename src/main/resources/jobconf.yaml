# ═══════════════════════════════════════════════════════════════════════
# Velocity Engine Flink Job — Example Configuration
# One copy of this file per Flink job deployment (one per cluster-profile)
# Mount as ConfigMap at /opt/flink/usrlib/jobconf.yaml
# ═══════════════════════════════════════════════════════════════════════

job-name: UID-DP-VELOCITY-ENGINE-HDC-C1-HIGHVOL
job-version: 1.0.0-RELEASE
job-profile: HIGHVOL          # STANDARD | HIGHVOL | LONGWINDOW
cluster: HDC_CLUSTER_1
dc: HDC
created-by: velocity-team

# Flink parallelism for this job. HIGHVOL recommended: 16
parallelism: 16

# ── Checkpointing ────────────────────────────────────────────────────────────
checkpoint:
  interval-ms: 60000          # checkpoint every 60 seconds
  timeout-ms: 600000          # 10-minute timeout (safe for large incremental state)
  min-pause-ms: 15000         # min 15s gap between consecutive checkpoints
  mode: EXACTLY_ONCE
  storage: s3a://uid-dp-flink-checkpoints/hdc-c1-highvol/
  retain-on-cancel: true
  unaligned-enabled: true     # recommended for high-throughput jobs under backpressure

# ── RocksDB State Backend ─────────────────────────────────────────────────────
rocksdb:
  incremental: true           # incremental checkpoints — only changed SST files go to S3
  memory-per-slot-mb: 512     # managed by Flink memory pool (50% of task memory)
  write-buffer-ratio: 0.5
  high-prio-pool-ratio: 0.1

# ── Watermark ─────────────────────────────────────────────────────────────────
watermark:
  idleness-ms: 60000          # mark partition idle after 60s of no events

# ── Kafka ─────────────────────────────────────────────────────────────────────
kafka:
  brokers: "10.81.105.201:9092,10.81.107.175:9092,10.81.105.118:9092"
  rules-topic: "uid-dp-velocity-rules-hdc-c1-highvol"
  rules-group-id: "velocity-engine-rules-hdc-c1-highvol"
  late-data-topic: "uid-dp-velocity-late-events-hdc-c1"

# ── Source Topics ─────────────────────────────────────────────────────────────
# One entry per team topic consuming from this cluster.
# Adding a new topic = add entry here + ArgoCD sync (job restart from checkpoint).
sources:
  - topic: "auth_events_raw"
    group-id: "velocity-engine-auth-hdc-c1"
    offset: latest
    event-timestamp-field: "_event_timestamp"     # field name in raw Kafka event JSON
    event-timestamp-format: ISO_STRING            # ISO_STRING | EPOCH_MILLIS
    allowed-lateness-ms: 0                        # out-of-orderness bound for watermark

  # Uncomment to add more topics to this job:
  # - topic: "kyc_events_raw"
  #   group-id: "velocity-engine-kyc-hdc-c1"
  #   offset: latest
  #   event-timestamp-field: "_event_timestamp"
  #   event-timestamp-format: ISO_STRING
  #   allowed-lateness-ms: 0

# ── PostgreSQL (Rules Bootstrap) ──────────────────────────────────────────────
postgres:
  host: "10.10.0.20"
  port: 5432
  database: "velocity_engine"
  username: "velocity_user"
  password: "${POSTGRES_PASSWORD}"       # injected via K8s secret env var
  rules-table: "velocity_rules"

# ── Sinks ─────────────────────────────────────────────────────────────────────
sinks:

  # KeyDB — stores anomaly alerts with TTL (penalty_ttl_seconds from rule)
  keydb:
    enabled: true
    hosts: "10.10.122.101:6379,10.10.122.102:6379,10.10.122.103:6379"
    password: "${KEYDB_PASSWORD}"
    anomaly-key-prefix: "anomaly"
    connection-timeout-ms: 2000
    socket-timeout-ms: 2000

  # ClickHouse — stores all aggregation results for dashboards
  clickhouse:
    enabled: true
    # HDC ClickHouse cluster hosts (both nodes)
    hosts:
      - "10.10.120.85:8123"
      - "10.10.120.86:8123"
    user: "default"
    password: "${CLICKHOUSE_PASSWORD}"
    cluster-name: "velocity_cluster_hdc"     # ClickHouse cluster name
    use-distributed: true                     # create RMT + Distributed tables
    zookeeper-path: "/clickhouse/tables/{shard}/velocity_engine"
    database: "velocity_engine_hdc_c1_highvol"
    table: "rule_results"
    auto-create-ddl: true                     # CREATE DB + TABLE on job start
    num-writers: 4
    queue-max-capacity: 10000
    max-buffer-size: 5000
    flush-interval-ms: 5000
    timeout-sec: 60
    num-retries: 3
    failed-records-path: "/opt/flink/failed_records"

  # Iceberg — cold storage / data lake (raw events pass-through)
  iceberg:
    enabled: false                            # enable when Hive metastore is ready
    metastore-uri: "thrift://10.81.116.137:9083"
    s3-url: "http://10.10.103.12:425"
    warehouse: "s3a://uid-dp-data-lake"
    catalog: "velocity_catalog"
    database: "velocity_engine"
    parallelism: 2
